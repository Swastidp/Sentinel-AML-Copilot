[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-aml-copilot"
version = "0.1.0"
description = "Agentic AI copilot for anti-money-laundering alert triage and mule-network detection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # --- configuration & observability ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",

    # --- lakehouse & analytics ---
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",

    # --- statistics & ML ---
    "scikit-learn>=1.5",

    # --- synthetic data generation ---
    "faker>=30.0",

    # --- stores ---
    "psycopg[binary]>=3.2",
    "neo4j>=5.24",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "redis>=5.1",

    # --- agent ---
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",

    # --- api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # --- ui ---
    "streamlit>=1.39",
    "pyvis>=0.3.2",

    # --- reporting ---
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pandas-stubs",
    "types-openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["agent/prompts/*.md", "infrastructure/postgres/migrations/*.sql"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — modern Python idioms
    "B",    # bugbear — likely bugs
    "SIM",  # simplification
    "RUF",  # ruff-specific
    "ANN",  # missing type annotations
    "PTH",  # use pathlib, not os.path
]
ignore = [
    "ANN401", # allow typing.Any where it is genuinely the right type
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]          # test functions do not need return annotations
"src/sentinel/ui/**" = ["ANN201"]  # Streamlit page bodies are scripts, not APIs

# ---------------------------------------------------------------------------
# Type checking — this is the enforcement behind "type hints everywhere"
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["pyvis.*", "fastembed.*", "streamlit.*", "sklearn.*", "faker.*", "duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships `py.typed`, but `pyarrow.parquet` and `pyarrow.dataset` leave their public functions
# unannotated, so every call into them is a `no-untyped-call` error under --strict. Scoped to the two
# modules that touch them rather than relaxed package-wide: everything else keeps the full check.
module = [
    "sentinel.infrastructure.storage.parquet_store",
    "sentinel.infrastructure.storage.dq_store",
]
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `tests/unit/test_label_leakage.py` can import `scripts/check_label_leakage.py`.
# `scripts/` is not a package and must not become one — it holds entrypoints, not library code — so
# an implicit namespace import off the root is the way in. `src/` is unaffected: `sentinel` comes
# from the editable install either way.
pythonpath = ["."]
# `-rs` prints the reason for every skipped test in the summary. A test that vanishes quietly is
# worse than no test, because the run still reports green — so skips are made loud by default.
addopts = "-q -rs --strict-markers"
markers = [
    "integration: requires live cloud stores (Postgres, Neo4j, Qdrant, Redis)",
    "eval: costs LLM tokens — excluded from CI",
]
